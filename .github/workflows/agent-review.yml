name: Agent Review

on:
  workflow_dispatch:
    inputs:
      review_mode:
        description: "Review cost mode"
        required: false
        default: cheap
        type: choice
        options:
          - cheap
          - standard
          - deep
      pr_number:
        description: "Optional pull request number to review as untrusted diff data"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent-orchestrator

    steps:
      - name: Checkout review code
        uses: actions/checkout@v4
        with:
          # Provider-bearing code must come only from the trusted base branch.
          # PR contents are fetched separately as untrusted diff data.
          ref: stage4-mcp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts

      - name: Run tests without API secrets
        run: npm test

      - name: Run Claude + OpenAI review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-5
          REVIEW_MODE: ${{ inputs.review_mode || 'cheap' }}
          REVIEW_MAX_CHUNKS: ${{ inputs.review_mode == 'deep' && '0' || '4' }}
          REVIEW_MAX_ROUNDS: ${{ inputs.review_mode == 'deep' && '3' || '1' }}
          REVIEW_MAX_PROVIDER_CALLS: ${{ inputs.review_mode == 'deep' && '100' || '8' }}
          REVIEW_MAX_OUTPUT_TOKENS: ${{ inputs.review_mode == 'deep' && '1800' || '1200' }}
          REVIEW_TIME_BUDGET_MS: "240000"
          REVIEW_COST_BUDGET_USD: "0.50"
          REVIEW_ESTIMATED_COST_PER_1K_TOKENS_USD: "0.01"
          MAX_ROUNDS: "3"
          MAX_OUTPUT_TOKENS: "1600"
          REQUEST_TIMEOUT_MS: "120000"
          CLAUDE_REQUEST_TIMEOUT_MS: "120000"
          OPENAI_REQUEST_TIMEOUT_MS: "120000"
          PROVIDER_MAX_RETRIES: "1"
          STRUCTURED_MAX_RETRIES: "1"
          REVIEW_LOOP_TIMEOUT_MS: "600000"
          REVIEW_LOOP_GUARD_MS: "1000"
          REVIEW_PROGRESS_FILE: agent-review-progress.json
          MAX_DIFF_CHARS: "20000"
          MAX_DIFF_TOTAL_BYTES: "250000"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ inputs.pr_number || '' }}
          GITHUB_BASE: ${{ inputs.pr_number && '' || 'stage4-mcp' }}
          GITHUB_HEAD: ${{ inputs.pr_number && '' || github.ref_name }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing repository secret OPENAI_API_KEY"; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo "Missing repository secret ANTHROPIC_API_KEY"; exit 1; }
          set -o pipefail
          node src/index.js "Review this GitHub diff. Find only concrete high-impact problems; do not nitpick style." | tee agent-review.json

      - name: Upload review result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-review
          path: |
            agent-orchestrator/agent-review.json
            agent-orchestrator/agent-review-progress.json

      - name: Post review summary to PR
        if: false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- agent-review -->';
            const result = JSON.parse(fs.readFileSync('agent-orchestrator/agent-review.json', 'utf8'));
            const decision = result.decision || {};
            const issues = Array.isArray(decision.critical_issues) ? decision.critical_issues : [];
            const changes = Array.isArray(decision.recommended_changes) ? decision.recommended_changes : [];

            const bullet = items => items.length
              ? items.slice(0, 8).map(x => '- ' + x).join('\n')
              : '- None';

            const body = [
              marker,
              '## Agent Review',
              '',
              '**Final status:** `' + (result.final_status || 'unknown') + '`',
              '**Decision:** `' + (decision.status || 'unknown') + '`',
              '**Ready to merge:** `' + String(Boolean(decision.ready_to_merge)) + '`',
              '**Rounds:** `' + String(result.rounds ?? 0) + '`',
              '**Chunks:** `' + String(result.chunks_reviewed ?? 0) + '/' + String(result.chunks_total ?? 0) + '`',
              '',
              '### Critical issues',
              bullet(issues),
              '',
              '### Recommended changes',
              bullet(changes),
              '',
              '_Generated automatically by Claude + OpenAI orchestrator._'
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }
