name: Agent Orchestrator CI

on:
  push:
    branches:
      - trusted-reviewer-cost-aware
    paths:
      - "agent-orchestrator/**"
      - ".github/workflows/agent-orchestrator-ci.yml"
  pull_request:
    branches:
      - stage4-mcp
    paths:
      - "agent-orchestrator/**"
      - ".github/workflows/agent-orchestrator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        timeout-minutes: 3

      - name: Run full mock-only test suite
        run: npm test
        timeout-minutes: 3

      - name: Run provider and review-loop regression tests
        run: node --test test/provider-review.test.js test/github.test.js
        timeout-minutes: 2

      - name: Check JavaScript syntax
        shell: bash
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check
        timeout-minutes: 1

      - name: Check diff whitespace
        run: git diff --check
        timeout-minutes: 1
